<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Program Manipulation Training Camp</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <h1>Program Manipulation</h1>
        <p>Cursed Technique Training Interface</p>
      </div>
      <nav id="main-nav" class="nav"></nav>
      <div class="status-mini" id="mini-status"></div>
      <button id="daily-btn" class="btn glow">Claim Daily Training Bonus</button>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <h2 id="screen-title">Title Screen</h2>
          <p id="screen-subtitle">Rise from Grade 5 through pure technique control.</p>
        </div>
        <div class="topbar-actions">
          <button id="save-btn" class="btn">Save</button>
          <button id="load-btn" class="btn">Load</button>
          <button id="reset-btn" class="btn danger">Reset Slot</button>
        </div>
      </header>
      <section id="screen-root" class="screen-root"></section>
    </main>
  </div>

  <template id="modal-template">
    <div class="modal-backdrop">
      <div class="modal-panel">
        <h3 class="modal-title"></h3>
        <div class="modal-content"></div>
        <div class="modal-actions">
          <button class="btn close-modal">Close</button>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="js/main.js"></script>
</body>
</html>
